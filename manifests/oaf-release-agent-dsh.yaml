# release-agent 的 dsh 平行运行时部署（切换验证用，与 Java 实例并行）。
#
# 与 oaf-release-agent（Java）的对齐点：
# - 同一 OAF 包：platform-data PVC subPath packages/226 只读挂 /config（含 AGENTS.md + mcp-configs + skills）
# - 同一 env 契约：envFrom 同款 ConfigMap + Secret（LLM_* / MCP 网关凭据等）
# - 覆盖项：CHECKPOINT_JDBC_URL 指向独立库 agent_framework_dsh（架构原则二：服务间数据隔离；
#   env 显式键优先于 envFrom）
#
# 切换语义（验证通过后）：把 oaf-release-agent-svc 的 selector 追加 runtime 标签即把
# /agent/oaf-release-agent 流量切到本实例；回滚 = 去掉 selector。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oaf-release-agent-dsh
  namespace: agent-platform
  labels:
    app.kubernetes.io/name: oaf-release-agent
    runtime: dsh
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oaf-release-agent
      runtime: dsh
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oaf-release-agent
        runtime: dsh
    spec:
      containers:
        - name: runtime
          image: agent-framework-dsh:m0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8100
          envFrom:
            - configMapRef:
                name: oaf-release-agent-env
            - secretRef:
                name: oaf-release-agent-env-secret
          env:
            - name: AGENT_CONFIG_DIR
              value: /config
            - name: AGENT_WORKSPACE_DIR
              value: /workspace
            - name: SERVER_HOST
              value: 0.0.0.0
            - name: SERVER_PORT
              value: "8100"
            # 独立 checkpoint 库（隔离原则；env 显式键覆盖 envFrom 同名键）
            - name: CHECKPOINT_JDBC_URL
              value: "jdbc:mysql://oaf-mysql.agent-platform.svc.cluster.local:3306/agent_framework_dsh"
            - name: CHECKPOINT_USERNAME
              value: oaf_dsh
            - name: CHECKPOINT_PASSWORD
              value: OafDsh2026
          volumeMounts:
            - mountPath: /config
              name: agent-files
              readOnly: true
              subPath: packages/226
            - mountPath: /workspace
              name: agent-workspace
          readinessProbe:
            httpGet:
              path: /health
              port: 8100
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8100
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: agent-files
          persistentVolumeClaim:
            claimName: platform-data
        - name: agent-workspace
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: oaf-release-agent-dsh-svc
  namespace: agent-platform
  labels:
    app.kubernetes.io/name: oaf-release-agent
    runtime: dsh
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: oaf-release-agent
    runtime: dsh
  ports:
    - port: 8100
      targetPort: 8100
